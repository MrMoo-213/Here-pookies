<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="/js/sparx.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  iframe { border: none; width: 100%; height: 100vh; display: block; }
</style>
</head>
<body>
<iframe id="target-frame"></iframe>
<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var targetUrl = params.get("url");
    var frame = document.getElementById("target-frame");

    if (!targetUrl) return;

    fetch("/api/check-embeddable?url=" + encodeURIComponent(targetUrl))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.embeddable) {
          frame.src = targetUrl;
        } else {
          window.location.href = targetUrl;
        }
      })
      .catch(function() {
        // If the check itself fails, just send them to the site directly
        window.location.href = targetUrl;
      });
  })();
</script>
</body>
</html>
