<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/js/sparx.js"></script>
<title>Safe Search</title>
</head>

<body>

<iframe id="emulator" style="width:100%;height:100vh;border:0;"></iframe>

<script>
const prefix = "/home/apps/safe-search.html/";
const path = window.location.pathname;
let target = path.startsWith(prefix) ? path.slice(prefix.length) : "";

try {
    target = decodeURIComponent(target);
} catch {
    target = "";
}

if (/^https?:\/\//i.test(target)) {
    history.replaceState(null, "", "/home/apps/safe-search.html");
    document.getElementById("emulator").src = target;
}
</script>

</body>
</html>
