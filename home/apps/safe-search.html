<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="/js/sparx.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  iframe { border: none; width: 100%; height: 100vh; display: block; }
</style>
</head>
<body>
<iframe id="target-frame"></iframe>
<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var targetUrl = params.get("url");

    if (targetUrl) {
      document.getElementById("target-frame").src = targetUrl;
    }
  })();
</script>
</body>
</html>
