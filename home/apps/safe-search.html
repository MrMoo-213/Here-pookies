<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="/js/sparx.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  iframe { border: none; width: 100%; height: 100vh; display: block; }
  #error-screen {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: sans-serif;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
    background: #fff;
  }
  #error-screen button, #error-screen a {
    margin: 6px;
    padding: 10px 20px;
    border: 1px solid #333;
    border-radius: 6px;
    text-decoration: none;
    color: inherit;
    background: none;
    font-size: 14px;
    cursor: pointer;
    display: inline-block;
  }
</style>
</head>
<body>
<iframe id="target-frame"></iframe>
<div id="error-screen">
  <p>Error loading</p>
  <div>
    <button id="back-btn">Back</button>
    <a id="go-site-btn" target="_blank" rel="noopener">Go to website</a>
  </div>
</div>
<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var targetUrl = params.get("url");
    var frame = document.getElementById("target-frame");
    var errorScreen = document.getElementById("error-screen");
    var backBtn = document.getElementById("back-btn");
    var goSiteBtn = document.getElementById("go-site-btn");

    if (!targetUrl) return;

    goSiteBtn.href = targetUrl;

    frame.addEventListener("error", function() {
      errorScreen.style.display = "flex";
    });

    backBtn.addEventListener("click", function() {
      window.location.href = "/home/apps/";
    });

    frame.src = targetUrl;
  })();
</script>
</body>
</html>
